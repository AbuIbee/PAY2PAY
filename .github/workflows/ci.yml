name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # PRSprint 30 (docs/prsprints/PRSPRINT_30_CI_CD_DEPLOYMENT_GATES_SCHEMA_DRIFT_PREVENTION.md),
  # master-spec item 129: manually triggered post-deploy smoke test, run against a real deployment
  # URL (e.g. a Vercel preview or production URL) after a release. Not wired to fire automatically
  # right after a deploy — that needs Vercel API credentials this repo's CI does not have configured;
  # see scripts/smoke-test.mjs's own doc comment.
  workflow_dispatch:
    inputs:
      url:
        description: "Deployment URL to smoke-test (e.g. https://pay2pay.vercel.app)"
        required: true
        type: string

jobs:
  validate:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    env:
      # Dummy, non-production values so env validation succeeds in CI.
      # Real secrets are never stored in this workflow file.
      APP_ENV: test
      DATABASE_URL: postgres://ci:ci@localhost:5432/pay2pay_ci
      AUDIT_HASH_SECRET: ci-only-audit-hash-secret-value-not-real
      AUTH_PASSWORD_PEPPER: ci-only-auth-password-pepper-value-not-real
      NEXT_PUBLIC_APP_NAME: PAY2PAY
      NEXT_PUBLIC_APP_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        # Runs before typecheck: it generates .next/types (needed for the
        # PageProps/LayoutProps helper types) and performs its own type
        # check as part of the Next.js build itself.
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Tooling script tests
        run: npm run test:tooling

  fresh-migration-test:
    name: Fresh-database migration test
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    # PRSprint 30 (docs/prsprints/PRSPRINT_30_CI_CD_DEPLOYMENT_GATES_SCHEMA_DRIFT_PREVENTION.md),
    # master-spec item 191: proves the full migration set applies cleanly to a genuinely empty
    # database, on every push/PR — unlike schema-drift below, this needs no external credentials
    # (a disposable service-container Postgres, not the linked Supabase project), so it runs as a
    # real merge gate rather than a post-merge-only check.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: pay2pay_fresh_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Apply every migration to an empty database
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/pay2pay_fresh_migration_test
        run: npm run db:fresh-migration-test

  schema-drift:
    name: Supabase schema drift check
    runs-on: ubuntu-latest
    # Only runs on pushes to master/main, and only if repo secrets for a
    # linked Supabase project are configured — PRs from forks (and any
    # environment without these secrets) skip this job entirely rather than
    # failing, since it has nothing to check against without credentials.
    # PRSprint 01 (docs/prsprints/PRSPRINT_01_SUPABASE_MIGRATION_
    # RECONCILIATION.md): "Add schema-version/drift deployment check."
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check schema drift against linked Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: npm run db:check-drift

  smoke-test:
    name: Post-deploy smoke test
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run smoke tests against the given deployment URL
        run: npm run smoke-test -- --url "${{ inputs.url }}"
